name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: mkdir artifacts
      - run: npm pack --pack-destination artifacts
        env:
          HYPERFLOW_AUTH_HEADER: ${{ vars.HYPERFLOW_AUTH_HEADER }}
          HYPERFLOW_AUTH_VALUE: ${{ secrets.HYPERFLOW_AUTH_VALUE }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Test installed package and declarations
        run: |
          mkdir package-test
          cp -r tests examples package-test/
          cd package-test
          npm init --yes
          npm install --ignore-scripts --no-package-lock ../artifacts/*.tgz graphql@16.11.0 typescript@5.9.3
          node --test tests/*.test.mjs
          npx tsc --strict --noEmit --target ES2022 --module Node16 --moduleResolution Node16 tests/types.ts
