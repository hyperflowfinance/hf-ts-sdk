name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Stage SDK preview {0}', inputs.preview_version) || format('Release {0}', github.ref_name) }}
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      preview_version:
        description: "Deterministic npm stage preview version"
        required: true
        type: string
      schema_hash:
        required: true
        type: string
      captured_at:
        required: true
        type: string
      schema_sdl_url:
        required: true
        type: string
      schema_introspection_url:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: mkdir artifacts
      - name: Download and verify stage schema
        if: github.event_name == 'workflow_dispatch'
        env:
          SCHEMA_HASH: ${{ inputs.schema_hash }}
          SCHEMA_SDL_URL: ${{ inputs.schema_sdl_url }}
          SCHEMA_INTROSPECTION_URL: ${{ inputs.schema_introspection_url }}
        run: bash scripts/fetch-stage-schema.sh
      - name: Derive version from tag
        env:
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: bash scripts/set-package-version.sh
      - run: npm pack --pack-destination artifacts
        env:
          HYPERFLOW_AUTH_HEADER: ${{ vars.HYPERFLOW_AUTH_HEADER }}
          HYPERFLOW_AUTH_VALUE: ${{ secrets.HYPERFLOW_AUTH_VALUE }}
          HYPERFLOW_SCHEMA_FILE: ${{ github.event_name == 'workflow_dispatch' && 'stage-introspection.json' || '' }}
          HYPERFLOW_DEFAULT_API_URL: ${{ github.event_name == 'workflow_dispatch' && 'https://stage.api.hyperflowlabs.com/graphql' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Test installed package and declarations
        env:
          HYPERFLOW_EXPECTED_API_URL: ${{ github.event_name == 'workflow_dispatch' && 'https://stage.api.hyperflowlabs.com/graphql' || 'https://api.hyperflowlabs.com/graphql' }}
        run: bash scripts/test-package.sh
  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Publish tested artifact using npm trusted publishing
        env:
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: bash scripts/publish-package.sh
